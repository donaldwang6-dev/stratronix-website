        /* ===== LANGUAGE SELECTOR — always right-aligned ===== */
        .lang-selector { margin-left: auto; }
        .lang-btn { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; color: var(--text-dim); padding: 6px 12px; border-radius: 8px; cursor: pointer; transition: all 0.2s; border: 1px solid transparent; background: transparent; font-family: var(--font-body); white-space: nowrap; }

        .lang-btn .arrow { font-size: 10px; transition: transform 0.2s; }
        .lang-selector.open .lang-btn .arrow { transform: rotate(180deg); }
        .lang-dropdown { display: none; position: absolute; top: calc(100% + 8px); right: 0; background: var(--bg-card); border: 1px solid var(--border-solid); border-radius: 12px; padding: 8px 0; min-width: 180px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); z-index: 2000; }
        .lang-selector.open .lang-dropdown { display: block; }
        .lang-dropdown a { display: flex; align-items: center; gap: 10px; padding: 10px 16px; font-size: 14px; font-weight: 500; color: var(--text-dim); transition: all 0.15s; white-space: nowrap; }
        .lang-dropdown a:hover { color: var(--text); background: var(--bg-card-hover); }
        .lang-dropdown a .flag { font-size: 16px; }
        .lang-dropdown a .lang-code { font-size: 11px; color: var(--text-muted); margin-left: auto; }
